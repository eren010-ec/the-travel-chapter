<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="the-travel-chapter-icon.png">
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#1a1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TC Admin">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-admin.png">
<title>The Travel Chapter — Content Editor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream:#faf7f2; --cream2:#f2ede4; --navy:#1a1f2e; --navy2:#252b3b;
  --gold:#b8955a; --gold2:#d4aa70; --smoke:#6b7280;
  --border:#e5ddd0; --white:#ffffff; --text:#1a1f2e;
  --green:#27ae60; --red:#e05252; --sidebar-w:220px;
}
body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; display:flex; }

/* SIDEBAR */
.sidebar { width:var(--sidebar-w); min-height:100vh; background:var(--navy); display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:50; }
.sb-header { padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:10px; }
.sb-header img { width:40px; height:40px; object-fit:contain; flex-shrink:0; }
.sb-header > div { min-width:0; flex:1; }
.sb-brand { font-family:'DM Sans',sans-serif; font-size:0.76rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sb-sub { font-size:0.6rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav { flex:1; padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
.nav-section-label { font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.2); padding:10px 14px 4px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 13px; border-radius:7px; cursor:pointer; color:rgba(255,255,255,0.45); font-size:0.8rem; border:none; background:transparent; width:100%; text-align:left; transition:all 0.2s; }
.nav-item svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.nav-item:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
.nav-item.active { background:rgba(184,149,90,0.15); color:var(--gold2); }
.sb-footer { padding:12px; border-top:1px solid rgba(255,255,255,0.07); display:flex; flex-direction:column; gap:6px; }
.btn-preview { display:flex; align-items:center; justify-content:center; gap:8px; padding:9px; border-radius:7px; background:rgba(184,149,90,0.12); border:1px solid rgba(184,149,90,0.2); color:var(--gold2); font-family:'DM Sans',sans-serif; font-size:0.75rem; font-weight:500; text-decoration:none; transition:all 0.2s; }
.btn-preview:hover { background:rgba(184,149,90,0.2); }
.btn-back { display:flex; align-items:center; justify-content:center; gap:8px; padding:9px; border-radius:7px; background:rgba(255,255,255,0.04); border:none; color:rgba(255,255,255,0.35); font-family:'DM Sans',sans-serif; font-size:0.75rem; cursor:pointer; text-decoration:none; transition:all 0.2s; }
.btn-back:hover { color:rgba(255,255,255,0.7); background:rgba(255,255,255,0.07); }

/* MAIN */
.main { margin-left:var(--sidebar-w); flex:1; padding:36px 40px; background:var(--cream); min-height:100vh; }
.editor-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
.editor-header h1 { font-family:'Cormorant Garamond',serif; font-size:1.8rem; font-weight:300; color:var(--navy); }
.editor-header h1 em { font-style:italic; color:var(--gold); }
.editor-header p { font-size:0.78rem; color:var(--smoke); margin-top:2px; }
.save-bar { display:flex; align-items:center; gap:10px; }
.save-status { font-size:0.75rem; color:var(--smoke); }
.save-status.saved { color:var(--green); }
.save-status.unsaved { color:var(--gold); }

/* SECTION EDITOR */
.section-editor { display:none; }
.section-editor.active { display:block; animation:fadeIn 0.2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* CARDS */
.card { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:22px; margin-bottom:18px; }
.card-title { font-size:0.67rem; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; color:var(--smoke); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.card-title span { font-size:0.9rem; }

/* FORM FIELDS */
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.field:last-child { margin-bottom:0; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
label { font-size:0.67rem; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--smoke); }
.field-hint { font-size:0.68rem; color:#c5bdb4; margin-top:2px; }
input[type=text], input[type=email], input[type=url], input[type=number], textarea, select {
  padding:10px 13px; background:var(--cream); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif;
  font-size:0.85rem; font-weight:300; outline:none; width:100%;
  transition:border-color 0.2s, background 0.2s;
}
input:focus, textarea:focus, select:focus { border-color:var(--gold); background:var(--white); }
input::placeholder, textarea::placeholder { color:#c5bdb4; }
textarea { resize:vertical; min-height:80px; line-height:1.6; }
.char-count { font-size:0.65rem; color:#c5bdb4; text-align:right; margin-top:2px; }

/* ARRAY ITEMS */
.array-item { background:var(--cream2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; position:relative; }
.array-item-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.array-item-label { font-size:0.72rem; font-weight:500; color:var(--navy); }
.array-item-actions { display:flex; gap:6px; }
.btn-icon { width:28px; height:28px; border-radius:6px; border:1px solid var(--border); background:var(--white); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.75rem; transition:all 0.2s; color:var(--smoke); }
.btn-icon:hover { border-color:var(--red); color:var(--red); background:rgba(224,82,82,0.06); }
.btn-icon.move:hover { border-color:var(--navy); color:var(--navy); background:rgba(26,31,46,0.06); }
.btn-add-item { width:100%; padding:10px; border:1px dashed var(--border); border-radius:8px; background:transparent; color:var(--smoke); font-family:'DM Sans',sans-serif; font-size:0.78rem; cursor:pointer; transition:all 0.2s; margin-top:4px; }
.btn-add-item:hover { border-color:var(--gold); color:var(--gold); background:rgba(184,149,90,0.04); }

/* EMOJI PICKER */
.emoji-field { display:flex; align-items:center; gap:10px; }
.emoji-preview { width:44px; height:44px; border-radius:8px; background:var(--cream2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; cursor:pointer; }
.emoji-input { flex:1; }

/* IMAGE UPLOAD */
.image-upload-field { display:flex; align-items:center; gap:12px; }
.image-preview-thumb { width:60px; height:60px; border-radius:8px; object-fit:cover; border:1px solid var(--border); flex-shrink:0; background:var(--cream2); }
.image-upload-field input[type=file] { flex:1; font-size:0.78rem; }

/* GRADIENT PREVIEW */
.gradient-field { display:flex; align-items:center; gap:10px; }
.gradient-preview { width:44px; height:44px; border-radius:8px; flex-shrink:0; border:1px solid var(--border); }

/* TOGGLE */
.toggle-field { display:flex; align-items:center; gap:10px; }
.toggle { position:relative; width:40px; height:22px; flex-shrink:0; }
.toggle input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; background:var(--border); border-radius:22px; cursor:pointer; transition:0.25s; }
.toggle-slider::before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:var(--white); border-radius:50%; transition:0.25s; }
.toggle input:checked + .toggle-slider { background:var(--gold); }
.toggle input:checked + .toggle-slider::before { transform:translateX(18px); }

/* BUTTONS */
.btn { padding:9px 20px; border-radius:7px; border:none; font-family:'DM Sans',sans-serif; font-size:0.78rem; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
.btn-primary { background:var(--navy); color:var(--white); box-shadow:0 3px 10px rgba(26,31,46,0.15); }
.btn-primary:hover { background:var(--navy2); box-shadow:0 4px 16px rgba(26,31,46,0.25); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
.btn-ghost { background:transparent; color:var(--smoke); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--cream); color:var(--text); }

/* LIVE PREVIEW PANEL */
.preview-strip { background:var(--navy); border-radius:12px; padding:16px 20px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
.preview-strip p { font-size:0.78rem; color:rgba(255,255,255,0.45); }
.preview-strip strong { color:rgba(255,255,255,0.8); }

/* TOAST */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); padding:11px 22px; border-radius:50px; font-size:0.8rem; transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index:200; white-space:nowrap; border:1px solid; background:var(--white); }
.toast.show { transform:translateX(-50%) translateY(0); }

/* LOADING */
.loading { color:var(--smoke); font-size:0.83rem; text-align:center; padding:40px; }

@media(max-width:768px) {
  .sidebar { width:180px; } .main { margin-left:180px; padding:20px 16px; }
  .field-row { grid-template-columns:1fr; }
  .sb-header { padding:16px 12px 12px; gap:8px; }
  .sb-header img { width:28px; height:28px; }
  .sb-brand { font-size:0.6rem; letter-spacing:0.05em; }
  .sb-sub { font-size:0.5rem; letter-spacing:0.12em; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-header">
    <img src="the-travel-chapter-icon.png" alt="The Travel Chapter">
    <div>
      <div class="sb-brand">The Travel Chapter</div>
      <div class="sb-sub">Content Editor</div>
    </div>
  </div>
  <nav class="nav" id="cms-nav">
    <div class="nav-section-label">Page Sections</div>
    <button class="nav-item active" data-section="hero">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="10" rx="2"/><path d="M3 17h18M3 21h12"/></svg>Hero Banner
    </button>
    <button class="nav-item" data-section="destinations">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Destinations
    </button>
    <button class="nav-item" data-section="featured_trips">
      <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12 19.79 19.79 0 0 1 1.07 3.4 2 2 0 0 1 3 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16z"/></svg>Featured Trips
    </button>
    <button class="nav-item" data-section="membership">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Membership
    </button>
    <button class="nav-item" data-section="about">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>About Us
    </button>
    <button class="nav-item" data-section="testimonials">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Testimonials
    </button>
    <button class="nav-item" data-section="cta_banner">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>CTA Banner
    </button>
    <button class="nav-item" data-section="contact">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Contact
    </button>
    <button class="nav-item" data-section="footer">
      <svg viewBox="0 0 24 24"><rect x="2" y="17" width="20" height="5" rx="1"/><path d="M2 7h20M2 12h20"/></svg>Footer
    </button>
    <button class="nav-item" data-section="navbar">
      <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>Navigation
    </button>
  </nav>
  <div class="sb-footer">
    <a href="https://thetravelchapter.my/index.html" target="_blank" class="btn-preview">
      <svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Preview Landing Page
    </a>
    <a href="admin.html" class="btn-back">← Back to Admin Panel</a>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div id="editor-content">
    <div class="loading">Loading content editor…</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const SUPABASE_URL        = 'https://nkrpkfqibsudqsonljve.supabase.co';
const SUPABASE_ANON       = 'sb_publishable_8mbRk904S5zktFv6UIlRUg_gp1PFAWm';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// ── STATE ───────────────────────────────────────────────────
let cmsData   = {};     // all sections loaded from DB
let dirtyData = {};     // edited but not yet saved
let currentSection = 'hero';

// ── NAV ────────────────────────────────────────────────────
document.getElementById('cms-nav').addEventListener('click', function(e) {
  const btn = e.target.closest('.nav-item[data-section]');
  if (!btn) return;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  btn.classList.add('active');
  currentSection = btn.getAttribute('data-section');
  renderEditor(currentSection);
});

// ── INIT ───────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'admin-login.html'; return; }
  const { data: profile } = await sb.from('profiles').select('is_admin, is_staff').eq('id', session.user.id).single();
  if (!profile?.is_admin && !profile?.is_staff) { window.location.href = 'admin.html'; return; }

  const { data, error } = await sb.from('cms_content').select('*');
  if (error) { showToast('Error loading CMS: ' + error.message, true); return; }
  data.forEach(row => { cmsData[row.section] = row.content; });
  renderEditor('hero');
}

// ── IMAGE UPLOAD ────────────────────────────────────────────
async function uploadCmsImage(file, folder) {
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${folder}/${(crypto.randomUUID ? crypto.randomUUID() : Date.now())}.${ext}`;
  const { error: uploadErr } = await sb.storage.from('trip-images').upload(path, file);
  if (uploadErr) { showToast('Image upload failed: ' + uploadErr.message, true); return null; }
  return sb.storage.from('trip-images').getPublicUrl(path).data.publicUrl;
}
function handleHeroImageSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please choose an image file.', true); return; }
  if (file.size > 5 * 1024 * 1024) { showToast('Image must be under 5MB.', true); return; }
  const built = buildContentFromForm('hero');
  built.featured_card._file = file;
  built.featured_card._removed = false;
  cmsData['hero'] = built;
  renderEditor('hero');
}
function removeHeroImage() {
  const built = buildContentFromForm('hero');
  built.featured_card._file = null;
  built.featured_card._removed = true;
  built.featured_card.image = null;
  cmsData['hero'] = built;
  renderEditor('hero');
}
function handleDestImageSelect(event, i) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please choose an image file.', true); return; }
  if (file.size > 5 * 1024 * 1024) { showToast('Image must be under 5MB.', true); return; }
  const built = buildContentFromForm('destinations');
  built.items[i]._file = file;
  built.items[i]._removed = false;
  cmsData['destinations'] = built;
  renderEditor('destinations');
}
function removeDestImage(i) {
  const built = buildContentFromForm('destinations');
  built.items[i]._file = null;
  built.items[i]._removed = true;
  built.items[i].image = null;
  cmsData['destinations'] = built;
  renderEditor('destinations');
}

// ── SAVE ───────────────────────────────────────────────────
async function saveSection(section) {
  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const content = buildContentFromForm(section);

  if (section === 'hero' && content.featured_card) {
    const fc = content.featured_card;
    if (fc._file) {
      const url = await uploadCmsImage(fc._file, 'hero');
      if (url === null) { btn.disabled = false; btn.textContent = 'Save Changes'; return; }
      fc.image = url;
    } else if (fc._removed) {
      fc.image = null;
    }
    delete fc._file; delete fc._removed;
  }
  if (section === 'destinations' && content.items) {
    for (const item of content.items) {
      if (item._file) {
        const url = await uploadCmsImage(item._file, 'destinations');
        if (url === null) { btn.disabled = false; btn.textContent = 'Save Changes'; return; }
        item.image = url;
      } else if (item._removed) {
        item.image = null;
      }
      delete item._file; delete item._removed;
    }
  }

  const { error } = await sb.from('cms_content')
    .upsert({ section, content, updated_at: new Date().toISOString() }, { onConflict: 'section' });
  if (error) { showToast('Error saving: ' + error.message, true); }
  else {
    cmsData[section] = content;
    showToast('Section saved successfully ✓');
    document.getElementById('save-status').textContent = 'All changes saved';
    document.getElementById('save-status').className = 'save-status saved';
  }
  btn.disabled = false; btn.textContent = 'Save Changes';
}

// ── RENDER EDITOR ──────────────────────────────────────────
function renderEditor(section) {
  const data = cmsData[section] || {};
  const main = document.getElementById('editor-content');
  const sectionLabels = {
    hero:'Hero Banner', destinations:'Destinations', featured_trips:'Featured Trips',
    membership:'Membership Tiers', about:'About Us', testimonials:'Testimonials',
    cta_banner:'CTA Banner', contact:'Contact', footer:'Footer', navbar:'Navigation'
  };

  let html = `
    <div class="editor-header">
      <div>
        <h1>${sectionLabels[section] || section}</h1>
        <p>Edit the content for the <strong>${sectionLabels[section]}</strong> section of your landing page.</p>
      </div>
      <div class="save-bar">
        <span class="save-status" id="save-status">Ready to edit</span>
        <button class="btn btn-primary" id="btn-save" onclick="saveSection('${section}')">Save Changes</button>
      </div>
    </div>
    <div class="preview-strip">
      <p>Changes saved here will appear on your <strong>landing page</strong> automatically.</p>
      <a href="https://thetravelchapter.my/index.html" target="_blank" class="btn btn-ghost" style="color:rgba(255,255,255,0.6);border-color:rgba(255,255,255,0.15);font-size:0.72rem;">Preview Page ↗</a>
    </div>`;

  // Render section-specific form
  switch(section) {
    case 'hero':        html += renderHeroForm(data); break;
    case 'destinations':html += renderDestinationsForm(data); break;
    case 'featured_trips':html += renderFeaturedTripsForm(data); break;
    case 'membership':  html += renderMembershipForm(data); break;
    case 'about':       html += renderAboutForm(data); break;
    case 'testimonials':html += renderTestimonialsForm(data); break;
    case 'cta_banner':  html += renderCtaBannerForm(data); break;
    case 'contact':     html += renderContactForm(data); break;
    case 'footer':      html += renderFooterForm(data); break;
    case 'navbar':      html += renderNavbarForm(data); break;
    default: html += `<div class="card"><p style="color:var(--smoke)">Editor for this section coming soon.</p></div>`;
  }

  main.innerHTML = html;
  // Mark dirty on any input change
  main.querySelectorAll('input,textarea,select').forEach(el => {
    el.addEventListener('input', () => {
      document.getElementById('save-status').textContent = 'Unsaved changes';
      document.getElementById('save-status').className = 'save-status unsaved';
    });
  });
}

// ── SECTION FORMS ──────────────────────────────────────────

function renderHeroForm(d) {
  return `
  <div class="card">
    <div class="card-title"><span>✦</span> Eyebrow & Headline</div>

  obj = obj || {};

  return '';
}
function imageUploadField(previewUrl, onChangeCall, removeFnCall) {
  return `
    <div class="image-upload-field">
      ${previewUrl ? `<img src="${previewUrl}" class="image-preview-thumb">` : ''}
      <input type="file" accept="image/*" onchange="${onChangeCall}">
      ${previewUrl ? `<button type="button" class="btn-icon" onclick="${removeFnCall}" title="Remove photo">✕</button>` : ''}
    </div>`;
}

// ── BUILD CONTENT FROM FORM ─────────────────────────────────
function buildContentFromForm(section) {
  const d = cmsData[section] || {};
  const v = id => { const el=document.getElementById(id); return el?el.value:''; };
  const c = id => { const el=document.getElementById(id); return el?el.checked:false; };

  switch(section) {
    case 'hero': {
      const stats = (d.stats||[]).map((_,i)=>({ value:v(`stat_val_${i}`), label:v(`stat_lbl_${i}`) }));
      return { ...d,
        eyebrow:v('hero_eyebrow'), heading:v('hero_heading'), heading_italic:v('hero_heading_italic'),
        subtext:v('hero_subtext'), cta_primary_label:v('hero_cta_primary_label'),
        cta_primary_href:v('hero_cta_primary_href'), cta_secondary_label:v('hero_cta_secondary_label'),
        cta_secondary_href:v('hero_cta_secondary_href'), stats,
        featured_card:{ emoji:v('hero_card_emoji'), title:v('hero_card_title'), subtitle:v('hero_card_subtitle'), price:v('hero_card_price'),
          image:d.featured_card?.image, _file:d.featured_card?._file, _removed:d.featured_card?._removed },
        floating_badge:v('hero_floating_badge')
      };
    }
    case 'destinations': {
      const items = (d.items||[]).map((item,i)=>({
        name:v(`dest_name_${i}`), region:v(`dest_region_${i}`),
        emoji:v(`dest_emoji_${i}`), gradient:v(`dest_gradient_${i}`), wide:c(`dest_wide_${i}`),
        image:item.image, _file:item._file, _removed:item._removed
      }));
      return { ...d, eyebrow:v('dest_eyebrow'), heading:v('dest_heading'), heading_italic:v('dest_heading_italic'), subtext:v('dest_subtext'), items };
    }
    case 'featured_trips':
      return { ...d, eyebrow:v('ft_eyebrow'), heading:v('ft_heading'), heading_italic:v('ft_heading_italic'), subtext:v('ft_subtext') };
    case 'membership': {
      const tiers = (d.tiers||[]).map((_,i)=>({
        icon:v(`tier_icon_${i}`), name:v(`tier_name_${i}`), points:v(`tier_pts_${i}`),
        cta:v(`tier_cta_${i}`), featured:c(`tier_featured_${i}`),
        perks:v(`tier_perks_${i}`).split('\n').map(s=>s.trim()).filter(Boolean)
      }));
      return { ...d, eyebrow:v('mem_eyebrow'), heading:v('mem_heading'), heading_italic:v('mem_heading_italic'), subtext:v('mem_subtext'), tiers };
    }
    case 'about': {
      const paragraphs = (d.paragraphs||[]).map((_,i)=>v(`about_para_${i}`));
      const values = (d.values||[]).map((_,i)=>({ icon:v(`val_icon_${i}`), title:v(`val_title_${i}`), desc:v(`val_desc_${i}`) }));
      return { ...d, eyebrow:v('about_eyebrow'), heading:v('about_heading'), heading_italic:v('about_heading_italic'), subtext:v('about_subtext'), paragraphs, badge_value:v('about_badge_val'), badge_label:v('about_badge_lbl'), values };
    }
    case 'testimonials': {
      const items = (d.items||[]).map((_,i)=>({
        text:v(`test_text_${i}`), name:v(`test_name_${i}`), initials:v(`test_initials_${i}`),
        trip:v(`test_trip_${i}`), stars:parseInt(v(`test_stars_${i}`))||5
      }));
      return { ...d, eyebrow:v('test_eyebrow'), heading:v('test_heading'), heading_italic:v('test_heading_italic'), items };
    }
    case 'cta_banner':
      return { ...d, heading:v('cta_heading'), heading_italic:v('cta_heading_italic'), subtext:v('cta_subtext'),
        cta_primary_label:v('cta_primary_label'), cta_primary_href:v('cta_primary_href'),
        cta_secondary_label:v('cta_secondary_label'), cta_secondary_href:v('cta_secondary_href') };
    case 'contact':
      return { ...d, eyebrow:v('con_eyebrow'), heading:v('con_heading'), heading_italic:v('con_heading_italic'),
        subtext:v('con_subtext'), email:v('con_email'), phone:v('con_phone'), address:v('con_address'),
        trip_options:v('con_trip_options').split('\n').map(s=>s.trim()).filter(Boolean) };
    case 'footer':
      return { ...d, tagline:v('footer_tagline'), copyright:v('footer_copyright'), location_badge:v('footer_location_badge') };
    case 'navbar':
      // links intentionally left untouched — not editable here, see renderNavbarForm's info note
      return { ...d, logo:v('nav_logo') };
    default: return d;
  }
}

// ── ARRAY HELPERS ──────────────────────────────────────────
function addStat() {
  const d = cmsData['hero'] || {};
  d.stats = [...(d.stats||[]), { value:'', label:'' }];
  cmsData['hero'] = { ...cmsData['hero'], ...buildContentFromForm('hero'), stats:d.stats };
  renderEditor('hero');
}
function removeStat(i) {
  const built = buildContentFromForm('hero');
  built.stats.splice(i,1);
  cmsData['hero'] = built;
  renderEditor('hero');
}
function addDestination() {
  const built = buildContentFromForm('destinations');
  built.items.push({ name:'', region:'', emoji:'✈️', gradient:'linear-gradient(160deg,#1a3a2a,#2d6a4f)', wide:false });
  cmsData['destinations'] = built;
  renderEditor('destinations');
}
function removeDestination(i) {
  const built = buildContentFromForm('destinations');
  built.items.splice(i,1);
  cmsData['destinations'] = built;
  renderEditor('destinations');
}
function moveDestination(i, dir) {
  const built = buildContentFromForm('destinations');
  const j = i + dir;
  if (j<0||j>=built.items.length) return;
  [built.items[i],built.items[j]]=[built.items[j],built.items[i]];
  cmsData['destinations'] = built;
  renderEditor('destinations');
}
function addTestimonial() {
  const built = buildContentFromForm('testimonials');
  built.items.push({ text:'', name:'', initials:'', trip:'', stars:5 });
  cmsData['testimonials'] = built;
  renderEditor('testimonials');
}
function removeTestimonial(i) {
  const built = buildContentFromForm('testimonials');
  built.items.splice(i,1);
  cmsData['testimonials'] = built;
  renderEditor('testimonials');
}

function esc(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

let tt;
function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background  = err?'#fff5f5':'#f0faf4';
  t.style.borderColor = err?'rgba(224,82,82,0.3)':'rgba(92,184,122,0.3)';
  t.style.color       = err?'#c0392b':'#27ae60';
  t.classList.add('show');
  clearTimeout(tt);
  tt = setTimeout(()=>t.classList.remove('show'), 3500);
}
