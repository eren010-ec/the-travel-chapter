<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="the-travel-chapter-icon.png">
<title>The Travel Chapter — Member Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream:  #faf7f2;
  --cream2: #f2ede4;
  --navy:   #1a1f2e;
  --navy2:  #252b3b;
  --gold:   #b8955a;
  --gold2:  #d4aa70;
  --smoke:  #6b7280;
  --border: #e5ddd0;
  --white:  #ffffff;
  --text:   #1a1f2e;
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── NAVBAR (matches website) ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 5%; height: 70px;
  background: rgba(250,247,242,0.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}
.nav-logo-img { height: 38px; width: auto; object-fit: contain; flex-shrink: 0; }
.nav-logo-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--gold);
}
.nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
.nav-links a { font-size: 0.82rem; letter-spacing: 0.05em; color: var(--smoke); text-decoration: none; transition: color 0.2s; }
.nav-links a:hover { color: var(--navy); }
.nav-back {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.8rem; color: var(--smoke); text-decoration: none;
  transition: color 0.2s;
}
.nav-back:hover { color: var(--gold); }
.nav-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

/* ── HERO SECTION ── */
.hero {
  margin-top: 70px;
  min-height: calc(100vh - 70px);
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, #1e2a3a 100%);
  position: relative; overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 60% at 30% 50%, rgba(184,149,90,0.12) 0%, transparent 60%),
              radial-gradient(ellipse 50% 70% at 80% 30%, rgba(184,149,90,0.08) 0%, transparent 55%);
}
.hero-inner {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 80px;
  max-width: 1100px; width: 90%; padding: 60px 0;
}
.hero-text { flex: 1; }
.hero-eyebrow {
  font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold2); margin-bottom: 20px;
}
.hero-text h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.2rem; font-weight: 300; line-height: 1.15;
  color: var(--white); margin-bottom: 16px;
}
.hero-text h1 em { font-style: italic; color: var(--gold2); }
.hero-text p {
  font-size: 0.9rem; color: rgba(255,255,255,0.55);
  line-height: 1.7; max-width: 360px; margin-bottom: 28px;
}
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-hero-primary {
  padding: 13px 28px; border-radius: 6px; border: none;
  background: linear-gradient(135deg, var(--gold), #a07840);
  color: var(--white); font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; cursor: pointer; text-decoration: none;
  display: inline-block; transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(184,149,90,0.3);
}
.btn-hero-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(184,149,90,0.4); }
.btn-hero-ghost {
  padding: 13px 28px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8); font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem; font-weight: 400; letter-spacing: 0.08em;
  text-transform: uppercase; cursor: pointer; text-decoration: none;
  display: inline-block; transition: all 0.2s; background: transparent;
}
.btn-hero-ghost:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.4); }

/* ── AUTH CARD ── */
.auth-card {
  width: 100%; max-width: 400px; flex-shrink: 0;
  background: var(--white);
  border-radius: 16px; padding: 36px 32px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.3);
}
.tabs {
  display: flex; background: var(--cream); border-radius: 8px;
  padding: 4px; margin-bottom: 28px; gap: 4px;
  border: 1px solid var(--border);
}
.tab-btn {
  flex: 1; padding: 9px; border: none; background: transparent;
  border-radius: 6px; font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem; font-weight: 500; letter-spacing: 0.05em;
  color: var(--smoke); cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { background: var(--navy); color: var(--white); }
.form { display: flex; flex-direction: column; gap: 14px; }
.form.hidden { display: none; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
label {
  font-size: 0.68rem; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--smoke);
}
.input-wrap { position: relative; }
.input-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; stroke: #c5bdb4; fill: none;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  pointer-events: none; transition: stroke 0.2s;
}
.input-wrap:focus-within svg { stroke: var(--gold); }
input {
  width: 100%; padding: 11px 12px 11px 36px;
  background: var(--cream); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 300;
  outline: none; transition: border-color 0.2s, background 0.2s;
}
input::placeholder { color: #c5bdb4; }
input:focus { border-color: var(--gold); background: var(--white); }
.btn-submit {
  width: 100%; padding: 13px; border: none; border-radius: 8px;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  color: var(--white); font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem; font-weight: 500; letter-spacing: 0.1em;
  text-transform: uppercase; cursor: pointer; margin-top: 4px;
  transition: all 0.2s; box-shadow: 0 4px 16px rgba(26,31,46,0.2);
}
.btn-submit:hover { background: linear-gradient(135deg, #252b3b, #1a1f2e); box-shadow: 0 6px 20px rgba(26,31,46,0.3); transform: translateY(-1px); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.divider {
  display: flex; align-items: center; gap: 10px;
  color: #c5bdb4; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.social-btn {
  width: 100%; padding: 11px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--white); color: var(--smoke);
  font-family: 'DM Sans', sans-serif; font-size: 0.83rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: all 0.2s;
}
.social-btn:hover { background: var(--cream); border-color: #c5bdb4; color: var(--text); }
.social-btn svg { width: 17px; height: 17px; }
.form-footer { text-align: center; font-size: 0.76rem; color: var(--smoke); }
.form-footer a { color: var(--gold); text-decoration: none; cursor: pointer; }
.form-footer a:hover { text-decoration: underline; }
.forgot { text-align: right; font-size: 0.73rem; margin-top: -6px; }
.forgot a { color: var(--gold); text-decoration: none; cursor: pointer; font-size: 0.73rem; }
.pw-strength { display: flex; gap: 3px; margin-top: 5px; }
.pw-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
.pw-bar.weak   { background: #e05252; }
.pw-bar.medium { background: var(--gold); }
.pw-bar.strong { background: #5cb87a; }
.err-msg { color: #e05252; font-size: 0.73rem; display: none; }
.err-msg.visible { display: block; }
.card-brand {
  text-align: center; margin-bottom: 24px;
  padding-bottom: 20px; border-bottom: 1px solid var(--border);
}
.card-brand img { height: 40px; width: auto; object-fit: contain; margin: 0 auto 10px; display: block; }
.card-brand .name {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--gold);
}
.card-brand .sub { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--smoke); margin-top: 3px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  padding: 11px 22px; border-radius: 50px; font-size: 0.8rem;
  backdrop-filter: blur(12px); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 200; white-space: nowrap; border: 1px solid;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media(max-width: 900px) {
  .hero-inner { flex-direction: column; gap: 40px; align-items: stretch; }
  .hero-text h1 { font-size: 2.2rem; }
  .auth-card { max-width: 100%; }
}
@media(max-width: 480px) {
  .auth-card { padding: 28px 20px; }
  .field-row { flex-direction: column; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo"><img src="the-travel-chapter-icon.png" alt="The Travel Chapter" class="nav-logo-img"><span class="nav-logo-text">The Travel Chapter</span></a>
  <a href="index.html" class="nav-back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Website
  </a>
</nav>

<!-- HERO + AUTH -->
<section class="hero">
  <div class="hero-inner">
    <!-- Left: hero text -->
    <div class="hero-text">
      <div class="hero-eyebrow">✦ Member Portal</div>
      <h1>Your Journey<br>Starts <em>Here</em></h1>
      <p>Sign in to access your bookings, explore curated trips, and manage your membership — all in one place.</p>
      <div class="hero-actions">
        <a href="https://elaborate-clafoutis-52f5fa.netlify.app/#destinations" class="btn-hero-primary">Explore Destinations</a>
        <a href="https://elaborate-clafoutis-52f5fa.netlify.app/#about" class="btn-hero-ghost">Our Story</a>
      </div>
    </div>

    <!-- Right: auth card -->
    <div class="auth-card">
      <div class="card-brand">
        <img src="the-travel-chapter-icon.png" alt="The Travel Chapter">
        <div class="name">The Travel Chapter</div>
        <div class="sub">Member Portal</div>
      </div>

      <!-- LOGIN -->
      <div class="form" id="form-login">
        <div class="field">
          <label>Email Address</label>
          <div class="input-wrap">
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <span class="err-msg" id="login-err"></span>
        </div>
        <div class="forgot"><a onclick="handleForgotPassword()">Forgot password?</a></div>
        <button class="btn-submit" id="btn-login" onclick="handleLogin()">Sign In</button>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL  = 'https://nkrpkfqibsudqsonljve.supabase.co';
const SUPABASE_ANON = 'sb_publishable_8mbRk904S5zktFv6UIlRUg_gp1PFAWm';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// Admin/staff accounts belong on admin-login.html, not the member portal.
async function routeSession(session) {
  if (!session) return;
  const { data: profile } = await sb.from('profiles').select('is_admin, is_staff').eq('id', session.user.id).single();
  if (profile?.is_admin || profile?.is_staff) {
    await sb.auth.signOut();
    showErr('login-err', 'This is an admin/staff account — please sign in at the admin portal instead.');
    return;
  }
  window.location.href = 'dashboard.html';
}

// Redirect if already logged in
sb.auth.getSession().then(({ data: { session } }) => routeSession(session));
sb.auth.onAuthStateChange((event, session) => routeSession(session));

function clearErrors() {
  document.querySelectorAll('.err-msg').forEach(e => { e.textContent = ''; e.classList.remove('visible'); });
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.add('visible');
}

async function handleLogin() {
  clearErrors();
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  if (!email || !pw) { showErr('login-err', 'Please fill in all fields.'); return; }
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { showErr('login-err', error.message); btn.disabled = false; btn.textContent = 'Sign In'; }
}

async function handleForgotPassword() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showErr('login-err', 'Enter your email above first.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/dashboard.html' });
  if (error) showErr('login-err', error.message);
  else showToast('Password reset link sent to ' + email);
}

let toastTimer;
function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background  = err ? 'rgba(224,82,82,0.1)'   : 'rgba(92,184,122,0.1)';
  t.style.borderColor = err ? 'rgba(224,82,82,0.3)'   : 'rgba(92,184,122,0.3)';
  t.style.color       = err ? '#c0392b'                : '#27ae60';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
</html>
